{% extends "base.html" %}{% block content %}
<div class="card" style="max-width:420px;margin:2rem auto"><h2>Neue PIN festlegen</h2><p>Beim ersten Start nach dem Sicherheitsupdate muss die Standard-PIN ersetzt werden.</p><form method="post"><input type="hidden" name="_csrf_token" value="{{ csrf_token() }}"><label for="pin">Neue PIN (6 Ziffern)</label><input id="pin" name="pin" type="password" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" minlength="6" autocomplete="new-password" required><label for="confirm_pin">PIN wiederholen</label><input id="confirm_pin" name="confirm_pin" type="password" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" minlength="6" autocomplete="new-password" required><button type="submit">PIN speichern</button></form></div>{% endblock %}
