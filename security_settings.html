{% extends "base.html" %}{% block content %}
<div class="card" style="max-width:480px"><h2>Sicherheit – PIN ändern</h2><form method="post"><input type="hidden" name="_csrf_token" value="{{ csrf_token() }}"><label for="current_pin">Aktuelle PIN</label><input id="current_pin" name="current_pin" type="password" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" minlength="6" required><label for="new_pin">Neue PIN</label><input id="new_pin" name="new_pin" type="password" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" minlength="6" required><label for="confirm_pin">Neue PIN wiederholen</label><input id="confirm_pin" name="confirm_pin" type="password" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" minlength="6" required><button type="submit">PIN ändern</button></form></div>{% endblock %}
